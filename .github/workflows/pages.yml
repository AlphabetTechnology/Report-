# Publishes the app to GitHub Pages: https://alphabettechnology.github.io/Report-/
# Pages has no server, so this build calls Claude from the browser with each
# user's own API key (see src/lib/api.ts). The site is pushed to the gh-pages branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/laughing-ramanujan-6kkg0x, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: |
          # Server-only routes are not part of the static site.
          rm -rf src/app/api src/app/login
          npx next build
          touch out/.nojekyll
          echo "{\"build\":\"${GITHUB_SHA}\"}" > out/version.json
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_DIRECT_AI: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optional default for everyone: Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}

      - name: Keep files from the previous version
        # Tabs opened before this deploy still ask for the old script files;
        # keeping them avoids "Failed to load chunk" errors. If old files ever
        # pass 60 MB they are dropped and the next deploy starts fresh.
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            mkdir -p previous
            git archive FETCH_HEAD _next/static | tar -x -C previous 2>/dev/null || true
            if [ -d previous/_next/static ] && [ "$(du -sm previous/_next/static | cut -f1)" -lt 60 ]; then
              cp -rn previous/_next/static/. out/_next/static/ 2>/dev/null || true
            fi
          fi

      - name: Publish to gh-pages branch
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
